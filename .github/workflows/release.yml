name: Stable release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Load private release evidence
        env:
          STDGF_RELEASE_QA: ${{ secrets.STDGF_RELEASE_QA }}
        run: |
          test -n "$STDGF_RELEASE_QA"
          printf '%s' "$STDGF_RELEASE_QA" > "$RUNNER_TEMP/release-evidence.json"
      - name: Validate numeric tag and build production package
        env:
          STDGF_TAG: ${{ github.ref_name }}
        run: python3 bin/build.py --tag "$STDGF_TAG" --qa "$RUNNER_TEMP/release-evidence.json"
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/savethedate-for-gravity-forms
          strict: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          STDGF_TAG: ${{ github.ref_name }}
        run: gh release create "$STDGF_TAG" "dist/savethedate-for-gravity-forms-$STDGF_TAG.zip" --verify-tag --generate-notes
